# 设计模板，非有效发布 BOM。null 与空列表需在真实构建时补齐或明确排除。
# 不填猜测的官方版本、虚构 commit、假 hash 或密钥。正式校验器尚未实现。
bom_schema_version: 1
state: planning
release_id: null
created_at_utc: null
environment: null
target_platforms: []

# 交付分类与实际纳入范围；仅引用脱敏记录，不代替许可或能力证据。
delivery_scope:
  feature_scope_report_ref: null
  reuse_development_matrix_revision: null
  included_modules: [] # 每项：name/classification/evidence_ref；按需求可多类
  excluded_modules: [] # 每项：name/reason，不纳入需明确
  official_services: [] # 每项：name/version_or_contract/license_record_ref/evidence_ref
  payment_delivery_authority: null # official / emberrealm / not-included；同订单单一执行链

source:
  repository: null
  revision: null
  dirty: null
  dependency_lock_sha256: null

official_runtime:
  product_branch: null
  engine:
    version: null
    artifact_ref: null
    sha256: null
  gateways_and_db_service:
    bundle_version: null
    artifact_ref: null
    sha256: null
  database:
    sql_server_version: null
    schema_version: null
    schema_digest: null
    official_migration_ref: null
    backup_reference: null
  clients: [] # 每个目标端：platform/version/artifact_ref/sha256
  tools: [] # 每个工具：name/version/artifact_ref/sha256
  lua:
    runtime_version: null
    api_contract_version: null
    server_encoding: null
    client_encoding: utf-8
  capability_matrix_ref: null
  license_record_ref: null # 仅非敏感许可登记引用，不能嵌入授权码

emberrealm:
  server_lua:
    revision: null
    artifact_sha256: null
  client_lua:
    revision: null
    artifact_sha256: null
  gui_export_sha256: null
  tables:
    version: null
    source_sha256: null
    server_projection_sha256: null
    client_projection_sha256: null
    shared_projection_sha256: null
  messages:
    registry_version: null
    registry_sha256: null
  resources:
    version: null
    manifest_sha256: null
    manifest_ref: null
    hotfix_base_release: null
    package_refs: []
  platform:
    included: false
    revision: null
    artifact_sha256: null
    api_version: null
    migration_versions: []

compatibility:
  supported_client_versions: []
  required_database_schema: null
  required_api_contract: null
  supported_hotfix_bases: []
  rollback_release: null
  database_rollback_strategy: null # compatible / forward-fix / restore，必须附证据

verification:
  build_id: null
  validation_report_ref: null
  integration_report_ref: null
  restore_report_ref: null
  approval_or_authorization_ref: null

integrity:
  artifact_manifest_ref: null
  artifact_manifest_sha256: null
  metadata_signature_ref: null # 自有元数据；不能宣称官方客户端必然验证
